name: Self-hosted ABS validation (manual)

# Intentionally manual: preparing/pushing the fork must not start the deferred Apple build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Test ABS mode
        run: >-
          xcodebuild -project BookPlayer.xcodeproj -scheme BookPlayer
          -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17'
          -testPlan 'Unit Tests' -only-testing:BookPlayerTests/SelfHostedABSTests
          CODE_SIGNING_ALLOWED=NO test
  watch-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Build Watch simulator
        run: >-
          xcodebuild -project BookPlayer.xcodeproj -scheme BookPlayerWatch
          -configuration Debug -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
